<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo Cube">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15161f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Photo Cube</title>
<style>
  :root { color-scheme:dark; }
  html, body { margin:0; height:100%; background:#15161f; color:#fff; overflow:hidden;
    font-family: system-ui, -apple-system, Roboto, sans-serif; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:calc(16px + env(safe-area-inset-top, 0px)); left:0; right:0; text-align:center; font-size:20px;
    pointer-events:none; font-variant-numeric:tabular-nums; }
  #hint { position:fixed; top:calc(48px + env(safe-area-inset-top, 0px)); left:16px; right:16px; text-align:center; font-size:14px;
    color:#9aa0b8; pointer-events:none; }
  #bar { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); left:16px; right:16px; display:flex; justify-content:center; gap:12px; }
  button { background:#3b5bdb; color:#fff; border:0; border-radius:14px; padding:14px 22px;
    font-size:18px; font-weight:600; }
  button.secondary { background:#343a50; }
  #viewBar { position:fixed; bottom:calc(100px + env(safe-area-inset-bottom, 0px)); left:16px; right:16px;
    display:flex; justify-content:center; align-items:center; gap:14px; }
  #viewBar span { color:#9aa0b8; font-size:14px; }
  button.round { width:54px; height:54px; padding:0; border-radius:50%; background:#343a50; font-size:24px; line-height:1; }
  button:active { filter:brightness(1.2); }
  .overlay { position:fixed; inset:0; background:rgba(10,11,18,0.92); display:none;
    flex-direction:column; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  .overlay.show { display:flex; }
  .overlay h1 { margin:0 0 6px; font-size:30px; }
  .overlay p { margin:4px 0 16px; color:#c5c9da; text-align:center; font-size:16px; }
  #slots { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:100%; max-width:420px; margin-bottom:20px; }
  .slot { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; color:#c5c9da; }
  .slot canvas { width:100%; aspect-ratio:1; border-radius:10px; background:#222; }
  .slot input { display:none; }
  #win .stats { font-size:22px; margin:8px 0 20px; text-align:center; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">Swipe a square to turn its row · swipe empty space or use the arrows to look around</div>
<div id="viewBar">
  <button id="viewLeft" class="round" aria-label="Turn the view left">◀</button>
  <button id="viewFlip" class="round" aria-label="Flip to see the top or bottom">⇅</button>
  <button id="viewRight" class="round" aria-label="Turn the view right">▶</button>
</div>
<div id="bar">
  <button id="startBtn">Start</button>
  <button id="resetBtn" class="secondary" style="display:none">Give up</button>
  <button id="photosBtn" class="secondary">Photos</button>
</div>

<div id="setup" class="overlay">
  <h1>Your photos</h1>
  <p>Tap a square to choose a photo for that side of the cube.<br>Each photo is cropped square and split into 9 tiles.</p>
  <div id="slots"></div>
  <button id="doneBtn">Done</button>
</div>

<div id="win" class="overlay">
  <h1>Solved! 🎉</h1>
  <div class="stats" id="winStats"></div>
  <button id="againBtn">Play again</button>
</div>

<script src="three.min.js"></script>
<script>
'use strict';
const V = THREE.Vector3;
const TEX = 512;

// Each face: outward normal n, and the photo's "right" and "up" directions on that face.
const FACES = [
  { name:'Front',  n:[0,0,1],  r:[1,0,0],  u:[0,1,0],  color:'#2f9e44' },
  { name:'Back',   n:[0,0,-1], r:[-1,0,0], u:[0,1,0],  color:'#1971c2' },
  { name:'Right',  n:[1,0,0],  r:[0,0,-1], u:[0,1,0],  color:'#e03131' },
  { name:'Left',   n:[-1,0,0], r:[0,0,1],  u:[0,1,0],  color:'#f76707' },
  { name:'Top',    n:[0,1,0],  r:[1,0,0],  u:[0,0,-1], color:'#f1f3f5' },
  { name:'Bottom', n:[0,-1,0], r:[1,0,0],  u:[0,0,1],  color:'#fcc419' },
];

function store(op, key, val) {
  try {
    if (op === 'get') return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (e) { return null; }
}

// ---------- face images ----------
const faceCanvases = FACES.map(() => { const c = document.createElement('canvas'); c.width = c.height = TEX; return c; });
const textures = faceCanvases.map(c => new THREE.CanvasTexture(c));
const thumbs = [];

function drawPlaceholder(i) {
  const ctx = faceCanvases[i].getContext('2d');
  ctx.fillStyle = FACES[i].color; ctx.fillRect(0, 0, TEX, TEX);
  ctx.fillStyle = i === 4 || i === 5 ? '#333' : '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 150px sans-serif'; ctx.fillText('▲', TEX / 2, TEX / 2 - 60);
  ctx.font = 'bold 72px sans-serif'; ctx.fillText(FACES[i].name, TEX / 2, TEX / 2 + 90);
}

function faceUpdated(i) {
  textures[i].needsUpdate = true;
  if (thumbs[i]) thumbs[i].getContext('2d').drawImage(faceCanvases[i], 0, 0, thumbs[i].width, thumbs[i].height);
}

function setPhoto(i, img) {
  // Crop to a centred square; for tall photos lean towards the top, where faces usually are.
  const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
  const sx = (w - s) / 2, sy = h > w ? (h - s) * 0.3 : (h - s) / 2;
  faceCanvases[i].getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, TEX, TEX);
  faceUpdated(i);
  store('set', 'face' + i, faceCanvases[i].toDataURL('image/jpeg', 0.85));
}

FACES.forEach((f, i) => {
  drawPlaceholder(i);
  const saved = store('get', 'face' + i);
  if (saved) {
    const img = new Image();
    img.onload = () => { faceCanvases[i].getContext('2d').drawImage(img, 0, 0, TEX, TEX); faceUpdated(i); };
    img.src = saved;
  }
});

// Photo picker slots
const slotsEl = document.getElementById('slots');
FACES.forEach((f, i) => {
  const label = document.createElement('label'); label.className = 'slot';
  const cv = document.createElement('canvas'); cv.width = cv.height = 160; thumbs[i] = cv;
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { const img = new Image(); img.onload = () => setPhoto(i, img); img.src = reader.result; };
    reader.readAsDataURL(file);
    input.value = '';
  });
  label.append(cv, input, document.createTextNode(f.name));
  slotsEl.append(label);
  faceUpdated(i);
});

// ---------- 3D scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
renderer.setClearColor(0x15161f);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
let camTheta = Math.PI / 5, camPhi = Math.PI / 3, camDist = 10;

function placeCamera() {
  camera.position.set(
    camDist * Math.sin(camPhi) * Math.sin(camTheta),
    camDist * Math.cos(camPhi),
    camDist * Math.sin(camPhi) * Math.cos(camTheta));
  camera.lookAt(0, 0, 0);
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const half = 2.9; // half-size of the space the cube needs
  const vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  camDist = Math.max(half / Math.tan(vfov / 2), half / Math.tan(hfov / 2));
  camera.updateProjectionMatrix();
  placeCamera();
}
window.addEventListener('resize', resize);

const faceMats = textures.map(t => new THREE.MeshBasicMaterial({ map:t }));
const boxGeo = new THREE.BoxGeometry(0.98, 0.98, 0.98);
const boxMat = new THREE.MeshBasicMaterial({ color:0x08080c });
let cubies = [];

function buildCube() {
  cubies.forEach(c => scene.remove(c));
  cubies = [];
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    if (!x && !y && !z) continue;
    const pos = new V(x, y, z);
    const cubie = new THREE.Mesh(boxGeo, boxMat);
    cubie.position.copy(pos);
    cubie.userData.home = pos.clone();
    FACES.forEach((f, i) => {
      const n = new V(...f.n), r = new V(...f.r), u = new V(...f.u);
      if (pos.dot(n) !== 1) return;
      const col = pos.dot(r) + 1, row = pos.dot(u) + 1;
      const g = new THREE.PlaneGeometry(0.92, 0.92);
      const uv = g.attributes.uv;
      for (let k = 0; k < uv.count; k++)
        uv.setXY(k, (col + 0.04 + uv.getX(k) * 0.92) / 3, (row + 0.04 + uv.getY(k) * 0.92) / 3);
      const sticker = new THREE.Mesh(g, faceMats[i]);
      sticker.position.copy(n).multiplyScalar(0.495);
      sticker.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(r, u, n));
      cubie.add(sticker);
    });
    scene.add(cubie);
    cubies.push(cubie);
  }
}
buildCube();

// ---------- turning ----------
const AXES = [new V(1,0,0), new V(0,1,0), new V(0,0,1)];
const pivot = new THREE.Object3D(); scene.add(pivot);
const queue = [];
let current = null; // { axis, layer, dir, duration, start, group, user }

function enqueue(axis, layer, dir, duration, user) { queue.push({ axis, layer, dir, duration, user }); }

function beginTurn(t) {
  pivot.quaternion.identity(); pivot.updateMatrixWorld();
  t.group = cubies.filter(c => Math.round(c.position.getComponent(t.axis)) === t.layer);
  t.group.forEach(c => pivot.attach(c));
  t.start = performance.now();
  current = t;
}

function finishTurn() {
  const t = current;
  pivot.quaternion.setFromAxisAngle(AXES[t.axis], t.dir * Math.PI / 2);
  pivot.updateMatrixWorld();
  const m = new THREE.Matrix4();
  t.group.forEach(c => {
    scene.attach(c);
    c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
    m.makeRotationFromQuaternion(c.quaternion);
    const e = m.elements;
    [0,1,2,4,5,6,8,9,10].forEach(k => { e[k] = Math.round(e[k]); });
    c.quaternion.setFromRotationMatrix(m);
  });
  current = null;
  onTurnDone(t);
}

function stepTurns(now) {
  if (!current && queue.length) beginTurn(queue.shift());
  if (!current) return;
  const p = current.duration > 0 ? Math.min(1, (now - current.start) / current.duration) : 1;
  if (p >= 1) { finishTurn(); if (!current && queue.length) stepTurns(now); return; }
  const ease = 1 - Math.pow(1 - p, 3);
  pivot.quaternion.setFromAxisAngle(AXES[current.axis], current.dir * Math.PI / 2 * ease);
}

function isSolved() {
  // Solved = every piece has the same rotation and sits where that rotation puts its home spot.
  // (Photo centres must be upright too, so this checks full orientation, not just colours.)
  const q0 = cubies[0].quaternion;
  return cubies.every(c =>
    Math.abs(c.quaternion.dot(q0)) > 0.999 &&
    c.userData.home.clone().applyQuaternion(q0).distanceTo(c.position) < 0.01);
}

// ---------- game state ----------
const hud = document.getElementById('hud');
const startBtn = document.getElementById('startBtn'), resetBtn = document.getElementById('resetBtn');
let state = 'idle'; // idle | scrambling | playing
let moves = 0, startTime = 0;

function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function updateHud() {
  if (state === 'playing') hud.textContent = 'Moves ' + moves + '   ·   ' + fmt(performance.now() - startTime);
  else if (state === 'scrambling') hud.textContent = 'Scrambling…';
  else { const b = store('get', 'bestTime'); hud.textContent = b ? 'Best time ' + fmt(+b) : 'Press Start to scramble'; }
}

let scrambleLeft = 0;
function scramble(count, duration) {
  state = 'scrambling';
  startBtn.style.display = 'none';
  let lastAxis = -1;
  for (let k = 0; k < count; k++) {
    let axis; do { axis = Math.floor(Math.random() * 3); } while (axis === lastAxis);
    lastAxis = axis;
    enqueue(axis, Math.random() < 0.5 ? -1 : 1, Math.random() < 0.5 ? -1 : 1, duration, false);
  }
  scrambleLeft = count;
}

const history = [];
function onTurnDone(t) {
  history.push({ axis:t.axis, layer:t.layer, dir:t.dir, user:t.user });
  if (state === 'scrambling' && !t.user) {
    if (--scrambleLeft === 0) {
      if (isSolved()) { scramble(5, 120); return; } // astronomically unlikely, but never start solved
      state = 'playing'; moves = 0; startTime = performance.now();
      resetBtn.style.display = '';
    }
  } else if (state === 'playing' && t.user) {
    moves++;
    if (isSolved()) win();
  }
}

function win() {
  const time = performance.now() - startTime;
  const best = +store('get', 'bestTime') || Infinity;
  const isBest = time < best;
  if (isBest) store('set', 'bestTime', String(Math.round(time)));
  document.getElementById('winStats').innerHTML =
    'Time ' + fmt(time) + '<br>' + moves + ' moves' + (isBest ? '<br>New best time!' : '<br>Best ' + fmt(best));
  state = 'idle';
  resetBtn.style.display = 'none'; startBtn.style.display = '';
  document.getElementById('win').classList.add('show');
}

startBtn.onclick = () => { if (state === 'idle' && !current && !queue.length) scramble(25, 110); };
resetBtn.onclick = () => {
  queue.length = 0; if (current) finishTurn();
  buildCube(); state = 'idle'; resetBtn.style.display = 'none'; startBtn.style.display = '';
};
document.getElementById('againBtn').onclick = () => document.getElementById('win').classList.remove('show');
document.getElementById('photosBtn').onclick = () => document.getElementById('setup').classList.add('show');
document.getElementById('doneBtn').onclick = () => document.getElementById('setup').classList.remove('show');
if (!FACES.some((f, i) => store('get', 'face' + i))) document.getElementById('setup').classList.add('show');

// ---------- touch input ----------
const raycaster = new THREE.Raycaster();
let drag = null; // { x, y, hit, normal, cubie, decided }

function toScreen(p) {
  const v = p.clone().project(camera);
  return { x:(v.x + 1) / 2 * window.innerWidth, y:(1 - v.y) / 2 * window.innerHeight };
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const ndc = new THREE.Vector2(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(cubies, true);
  drag = { x:e.clientX, y:e.clientY, lx:e.clientX, ly:e.clientY, decided:false };
  if (hits.length) {
    const h = hits[0];
    drag.cubie = h.object.parent === scene ? h.object : h.object.parent;
    const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    drag.normal = new V(Math.round(n.x), Math.round(n.y), Math.round(n.z));
    drag.point = h.point.clone();
  }
});

canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.cubie) { // orbit the camera
    camAnim = null;
    camTheta -= (e.clientX - drag.lx) * 0.014;
    camPhi = Math.min(Math.PI - 0.15, Math.max(0.15, camPhi - (e.clientY - drag.ly) * 0.014));
    drag.lx = e.clientX; drag.ly = e.clientY;
    placeCamera();
    return;
  }
  if (drag.decided) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, len = Math.hypot(dx, dy);
  if (len < 14) return;
  drag.decided = true;
  if (state === 'scrambling' || current || queue.length) return;
  // Which direction along the touched face best matches the swipe?
  const s0 = toScreen(drag.point);
  let best = null, bestDot = 0;
  AXES.forEach(t => {
    if (Math.abs(t.dot(drag.normal)) > 0.5) return;
    const s1 = toScreen(drag.point.clone().add(t));
    const sx = s1.x - s0.x, sy = s1.y - s0.y, sl = Math.hypot(sx, sy) || 1;
    const d = (dx * sx + dy * sy) / (len * sl);
    if (Math.abs(d) > Math.abs(bestDot)) { bestDot = d; best = t; }
  });
  if (!best) return;
  const a = new V().crossVectors(drag.normal, best); // turning about a moves the touched square toward +best
  const axis = [0, 1, 2].reduce((m, k) => Math.abs(a.getComponent(k)) > Math.abs(a.getComponent(m)) ? k : m, 0);
  const dir = Math.sign(bestDot) * Math.sign(a.getComponent(axis));
  const layer = Math.round(drag.cubie.position.getComponent(axis));
  enqueue(axis, layer, dir, 180, true);
});

['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => { drag = null; }));

// ---------- view buttons ----------
let camAnim = null;
function animateView(dTheta, phi) {
  camAnim = { t0:performance.now(), th0:camTheta, th1:camTheta + dTheta, ph0:camPhi, ph1:phi };
}
function stepView(now) {
  if (!camAnim) return;
  const p = Math.min(1, (now - camAnim.t0) / 350), e = 1 - Math.pow(1 - p, 3);
  camTheta = camAnim.th0 + (camAnim.th1 - camAnim.th0) * e;
  camPhi = camAnim.ph0 + (camAnim.ph1 - camAnim.ph0) * e;
  placeCamera();
  if (p >= 1) camAnim = null;
}
document.getElementById('viewLeft').onclick = () => animateView(Math.PI / 2, camPhi);
document.getElementById('viewRight').onclick = () => animateView(-Math.PI / 2, camPhi);
// Flip between looking down on the top and looking up at the bottom.
document.getElementById('viewFlip').onclick = () => animateView(0, camPhi < Math.PI / 2 ? Math.PI * 2 / 3 : Math.PI / 3);

// ---------- loop ----------
function frame(now) {
  stepTurns(now);
  stepView(now);
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// Hooks for automated testing.
window.__cube = { isSolved, enqueue, scramble, get state() { return state; }, get busy() { return !!current || queue.length > 0; },
  get moves() { return moves; }, setPhoto, history };
</script>
</body>
</html>
